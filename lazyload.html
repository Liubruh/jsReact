<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>懒加载</title>
  <style>
    .box {
      height: 400px; margin: 20px 0; background: #ccc;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; color: #fff;
    }
  </style>
</head>
<body>
  <div class="box" data-index="1" data-color="#e74c3c">未加载</div>
  <div class="box" data-index="2" data-color="#e67e22">未加载</div>
  <div class="box" data-index="3" data-color="#f1c40f">未加载</div>
  <div class="box" data-index="4" data-color="#2ecc71">未加载</div>
  <div class="box" data-index="5" data-color="#3498db">未加载</div>
  <div class="box" data-index="6" data-color="#9b59b6">未加载</div>

  <script>
    // IntersectionObserver: 实例对象，用来自动监听某个DOM元素是否进入浏览器的可视区域
    // unobserve: IntersectionObserver是实例下的一个方法，用于告诉观察器不要再盯该元素了，解除对该DOM元素的监听
    const boxes = document.querySelectorAll(".box");
    const observer = new IntersectionObserver((entries, obs) => { // 这里的obs指在观测器自己
        entries.forEach((entry) => {
            if (!entry.isIntersecting) return ; 

            const box = entry.target; // entry.target 指 进入 观测框的DOM元素
            box.style.backgroundColor = box.dataset.color;
            box.textContent = `已加载${box.dataset.index}`;
            obs.unobserve(box);
        });
    }, {threshold: 0.2}); // 露出20%就算是进入
    boxes.forEach(box => observer.observe(box)); // observer.observe(box)指 把每个box元素正式添加到观测器的控制名单中
  </script>
</body>
</html>
